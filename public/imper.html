<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>imper.ai — Identity Verification Platform</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@300;400;500&display=swap');

    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --green: #74E8B1;
      --bg: #1C2B4F;
      --text: #ffffff;
      --border: rgba(255,255,255,0.08);
    }

    html, body { height: 100%; }

    body {
      font-family: 'Inter', -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }

    /* ── Noise ── */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.03'/%3E%3C/svg%3E");
      pointer-events: none;
      z-index: 9999;
    }

    /* ══════════════════════════════════
       STRUCTURAL PATTERN:
       .section-full  → 100% width, border-bottom
         .section-frame  → max-width 1440px, border left+right
           .section-content → max-width 1200px, centered
       ══════════════════════════════════ */

    .section-full {
      width: 100%;
      position: relative;
    }

    .section-frame {
      max-width: 1330px;
      margin: 0 auto;
      position: relative;
      border-left: 1px solid var(--border);
      border-right: 1px solid var(--border);
    }

    .section-content {
      max-width: 1200px;
      margin: 0 auto;
      width: 100%;
      padding: 0 2rem;
    }

    /* Hide frame borders when viewport < 1440 */
    @media (max-width: 1330px) {
      .section-frame {
        border-left: none;
        border-right: none;
      }
    }

    /* ── Page wrapper ── */
    .page {
      width: 100%;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* ══════════════════════════════════
       NAVBAR
       ══════════════════════════════════ */
    .navbar-full {
      width: 100%;
      border-bottom: 1px solid var(--border);
      position: relative;
      z-index: 100;
      background: var(--bg);
      flex-shrink: 0;
    }

    .navbar-frame {
      max-width: 1330px;
      margin: 0 auto;
      border-left: 1px solid var(--border);
      border-right: 1px solid var(--border);
    }

    .navbar-content {
      max-width: 1200px;
      margin: 0 auto;
      padding: 1.1rem 2rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    @media (max-width: 1330px) {
      .navbar-frame {
        border-left: none;
        border-right: none;
      }
    }

    .nav-logo {
      display: flex;
      align-items: center;
      text-decoration: none;
      flex-shrink: 0;
    }

    .nav-logo img {
      height: 26px;
      width: auto;
    }

    .nav-right {
      display: flex;
      align-items: center;
      gap: 2.5rem;
    }

    .nav-links {
      display: flex;
      align-items: center;
      gap: 2.5rem;
      list-style: none;
    }

    .nav-links a {
      color: #ffffff;
      text-decoration: none;
      font-size: 0.875rem;
      font-weight: 400;
      letter-spacing: 0.02em;
      transition: color 0.3s;
    }

    .nav-links a:hover { color: var(--green); }

    .nav-cta {
      padding: 0.6rem 1.5rem;
      background: transparent;
      border: 1px solid var(--green);
      color: var(--green);
      border-radius: 100px;
      font-size: 0.875rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.3s;
      text-decoration: none;
      font-family: inherit;
      white-space: nowrap;
    }

    .nav-cta:hover {
      background: var(--green);
      color: var(--bg);
      box-shadow: 0 0 30px rgba(116, 232, 177, 0.3);
    }

    /* Hamburger */
    .nav-hamburger {
      display: none;
      flex-direction: column;
      gap: 5px;
      cursor: pointer;
      padding: 4px;
      background: none;
      border: none;
    }

    .nav-hamburger span {
      display: block;
      width: 22px;
      height: 1.5px;
      background: #ffffff;
      transition: all 0.3s;
    }

    /* ══════════════════════════════════
       HERO
       ══════════════════════════════════ */
    .hero-full {
      width: 100%;
      flex: 1;
      position: relative;
      overflow: hidden;
    }

    .hero-frame {
      max-width: 1330px;
      margin: 0 auto;
      height: 100%;
      border-left: 1px solid var(--border);
      border-right: 1px solid var(--border);
      position: relative;
    }

    @media (max-width: 1330px) {
      .hero-frame {
        border-left: none;
        border-right: none;
      }
    }

    /* ASCII canvas — fills the entire hero-full, behind everything */
    #ascii-container {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      cursor: default;
      user-select: none;
      z-index: 1;
    }

    #ascii-canvas {
      width: 100%;
      height: 100%;
      display: block;
    }

    #three-canvas {
      position: absolute;
      top: -9999px;
      left: -9999px;
      pointer-events: none;
    }

    /* Hero text overlays — inside the frame, positioned via section-content logic */
    .hero-subtitle {
      position: absolute;
      top: 2rem;
      left: 0;
      right: 0;
      z-index: 10;
      pointer-events: none;
    }

    .hero-subtitle .section-content {
      display: flex;
    }

    .hero-subtitle p {
      font-size: 0.95rem;
      color: var(--text);
      line-height: 1.6;
      font-weight: 400;
      letter-spacing: 0.01em;
      padding-left: var(--subtitle-offset, 0);
    }

    .hero-headline {
      position: absolute;
      bottom: 3rem;
      left: 0;
      right: 0;
      z-index: 10;
      pointer-events: none;
    }

    .hero-headline .section-content {
      display: flex;
    }

    .hero-headline h1 {
      font-size: clamp(2rem, 4vw, 3.5rem);
      font-weight: 600;
      line-height: 1.1;
      letter-spacing: -0.03em;
      max-width: 500px;
    }

    .hero-headline h1 .highlight {
      color: var(--green);
    }

    /* ── Partner logo ── */
    .hero-partner-logo {
      position: absolute;
      bottom: 3rem;
      left: 0;
      right: 0;
      z-index: 10;
      pointer-events: none;
    }

    .partner-logos {
      display: flex;
      align-items: center;
      gap: 2rem;
    }

    .partner-logo {
      height: 20px;
      width: auto;
      filter: grayscale(1) sepia(1) saturate(3) hue-rotate(100deg);
      mix-blend-mode: multiply;
      opacity: 0.5;
    }

    /* ── Typing cursor ── */
    .typed-cursor {
      display: inline;
      color: var(--green);
      font-weight: 300;
      animation: blink 0.7s step-end infinite;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }


    /* ══════════════════════════════════
       RESPONSIVE
       ══════════════════════════════════ */
    @media (max-width: 768px) {
      .nav-links { display: none; }
      .nav-hamburger { display: flex; }
      .nav-right { gap: 1rem; }

      .navbar-content { padding: 1rem 1.25rem; }
      .section-content { padding: 0 1.25rem; }

      .hero-headline h1 {
        font-size: clamp(1.8rem, 7vw, 2.5rem);
      }

      .hero-headline {
        bottom: 2rem;
      }

      .hero-subtitle {
        top: 1.5rem;
      }

      .hero-subtitle p {
        font-size: 0.85rem;
        padding-left: 0 !important;
      }
    }
  </style>
</head>
<body>

  <div class="page">

    <!-- ═══ NAVBAR ═══ -->
    <div class="navbar-full">
      <div class="navbar-frame">
        <div class="navbar-content">
          <a href="#" class="nav-logo" id="nav-logo">
            <img src="imerai-logo.webp" alt="imper.ai" />
          </a>
          <div class="nav-right">
            <ul class="nav-links">
              <li><a href="#" id="nav-platform">Platform</a></li>
              <li><a href="#">Solutions</a></li>
              <li><a href="#">Resources</a></li>
              <li><a href="#">Company</a></li>
            </ul>
            <a href="#" class="nav-cta">Get a demo &rarr;</a>
            <button class="nav-hamburger" aria-label="Menu">
              <span></span>
              <span></span>
              <span></span>
            </button>
          </div>
        </div>
      </div>
    </div>

    <!-- ═══ HERO ═══ -->
    <div class="hero-full">
      <div class="hero-frame">
        <!-- ASCII canvas — fills entire hero -->
        <div id="ascii-container">
          <canvas id="ascii-canvas"></canvas>
          <canvas id="three-canvas" width="600" height="600"></canvas>
        </div>

        <!-- Subtitle — top, aligned with end of logo -->
        <div class="hero-subtitle">
          <div class="section-content">
            <p>The first Identity Verification Platform<br>purpose-built for the <span style="color: var(--green)">workforce</span>.</p>
          </div>
        </div>

        <!-- Headline — bottom left -->
        <div class="hero-headline">
          <div class="section-content">
            <h1>Verify the human<br>behind every<br><span class="highlight"><span id="typed-text">password reset</span><span class="typed-cursor">|</span></span></h1>
          </div>
        </div>

        <!-- Partner logo bottom right -->
        <div class="hero-partner-logo">
          <div class="section-content" style="display:flex; justify-content:flex-end;">
            <div class="partner-logos">
              <img src="google-meet-logo.svg" alt="Google Meet" class="partner-logo" />
              <img src="zoom-icon.svg" alt="Zoom" class="partner-logo" style="height: 24px;" />
              <img src="microsoft-teams-logo.svg" alt="Microsoft Teams" class="partner-logo" style="height: 24px;" />
            </div>
          </div>
        </div>
      </div>
    </div>

  </div>

  <!-- Three.js + OBJLoader -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/OBJLoader.js"></script>

  <script>
    // ─── Align subtitle with Platform nav link (desktop) / flush left (mobile) ───
    function alignSubtitle() {
      const subtitleP = document.querySelector('.hero-subtitle p');
      if (!subtitleP) return;

      // Mobile — flush left, no offset
      if (window.innerWidth <= 768) {
        subtitleP.style.paddingLeft = '0';
        return;
      }

      // Desktop — align with left edge of "Platform" link
      const platformLink = document.getElementById('nav-platform');
      if (!platformLink) return;

      const linkRect = platformLink.getBoundingClientRect();
      subtitleP.style.paddingLeft = '0';
      const pRect = subtitleP.getBoundingClientRect();
      const offset = linkRect.left - pRect.left;
      subtitleP.style.paddingLeft = Math.max(0, offset) + 'px';
    }
    window.addEventListener('load', alignSubtitle);
    window.addEventListener('resize', alignSubtitle);
    requestAnimationFrame(alignSubtitle);

    // ─── ASCII Config ───
    const RENDER_SIZE = 600;
    const CHAR_SET_SHADOW  = [' ', ' ', '.', '.', '-', '-'];
    const CHAR_SET_MID     = [':', ':', '+', '+', '*', '*'];
    const CHAR_SET_HIGH    = ['#', '#', '%', '%', '@', '@'];
    const ALL_CHARS = [...CHAR_SET_SHADOW, ...CHAR_SET_MID, ...CHAR_SET_HIGH];

    const asciiCanvas = document.getElementById('ascii-canvas');
    const asciiCtx = asciiCanvas.getContext('2d');
    const threeCanvas = document.getElementById('three-canvas');

    threeCanvas.width = RENDER_SIZE;
    threeCanvas.height = RENDER_SIZE;

    // ─── Three.js Scene ───
    const scene = new THREE.Scene();
    const frustumSize = 5;
    const camera = new THREE.OrthographicCamera(
      -frustumSize, frustumSize, frustumSize, -frustumSize, 0.1, 1000
    );
    camera.position.set(0, 0, 10);
    camera.lookAt(0, 0, 0);

    const renderer = new THREE.WebGLRenderer({
      canvas: threeCanvas,
      alpha: true,
      antialias: false,
      preserveDrawingBuffer: true
    });
    renderer.setSize(RENDER_SIZE, RENDER_SIZE);
    renderer.setClearColor(0x000000, 0);

    scene.add(new THREE.AmbientLight(0xffffff, 0.25));

    const keyLight = new THREE.DirectionalLight(0xffffff, 1.2);
    keyLight.position.set(4, 6, 5);
    scene.add(keyLight);

    const fillLight = new THREE.DirectionalLight(0x74E8B1, 0.4);
    fillLight.position.set(-5, 2, -2);
    scene.add(fillLight);

    const rimLight = new THREE.DirectionalLight(0xffffff, 0.7);
    rimLight.position.set(-2, -4, -6);
    scene.add(rimLight);

    const topLight = new THREE.DirectionalLight(0x74E8B1, 0.3);
    topLight.position.set(0, 8, 0);
    scene.add(topLight);

    // ─── Load padlock.obj ───
    let modelLoaded = false;
    const pivotGroup = new THREE.Group();
    scene.add(pivotGroup);

    const loader = new THREE.OBJLoader();
    loader.load('padlock.obj', (obj) => {
      obj.traverse((child) => {
        if (child.isMesh) {
          child.material = new THREE.MeshPhongMaterial({
            color: 0xdddddd,
            specular: 0x74E8B1,
            shininess: 80,
            flatShading: false,
          });
        }
      });

      obj.rotation.x = -Math.PI / 2;
      obj.updateMatrixWorld(true);
      const box = new THREE.Box3().setFromObject(obj);
      const center = box.getCenter(new THREE.Vector3());
      const size = box.getSize(new THREE.Vector3());
      const maxDim = Math.max(size.x, size.y, size.z);
      const scale = 6.5 / maxDim;

      obj.position.sub(center);
      obj.scale.setScalar(scale);
      pivotGroup.add(obj);

      pivotGroup.rotation.y = 0.4;
      pivotGroup.rotation.x = 0.15;
      modelLoaded = true;
    });

    // ─── Interaction ───
    let isDragging = false;
    let prevMouse = { x: 0, y: 0 };
    let rotVel = { x: 0, y: 0 };
    let autoRotateSpeed = 0.008;
    let autoRotateTimer = null;

    const container = document.getElementById('ascii-container');

    function onDown(x, y) {
      isDragging = true;
      prevMouse = { x, y };
      if (autoRotateTimer) clearTimeout(autoRotateTimer);
      autoRotateSpeed = 0;
    }
    function onMove(x, y) {
      if (!isDragging) return;
      rotVel.y += (x - prevMouse.x) * 0.002;
      rotVel.x += (y - prevMouse.y) * 0.002;
      prevMouse = { x, y };
    }
    function onUp() {
      isDragging = false;
      autoRotateTimer = setTimeout(() => { autoRotateSpeed = 0.008; }, 2500);
    }

    container.addEventListener('mousedown', e => onDown(e.clientX, e.clientY));
    window.addEventListener('mousemove', e => onMove(e.clientX, e.clientY));
    window.addEventListener('mouseup', onUp);
    container.addEventListener('touchstart', e => { onDown(e.touches[0].clientX, e.touches[0].clientY); }, { passive: true });
    window.addEventListener('touchmove', e => { onMove(e.touches[0].clientX, e.touches[0].clientY); }, { passive: true });
    window.addEventListener('touchend', onUp);

    // ─── Resize ───
    function resizeCanvas() {
      const rect = container.getBoundingClientRect();
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      asciiCanvas.width = rect.width * dpr;
      asciiCanvas.height = rect.height * dpr;
      asciiCanvas.style.width = rect.width + 'px';
      asciiCanvas.style.height = rect.height + 'px';
    }
    resizeCanvas();
    window.addEventListener('resize', resizeCanvas);

    // ─── Pixel buffer ───
    const pixelBuf = new Uint8Array(RENDER_SIZE * RENDER_SIZE * 4);

    // ─── Scatter animation ───
    let assembleStartTime = null;
    const ASSEMBLE_DURATION = 600; // ms
    // Pre-generate random offsets for scatter (seeded by position)
    const MAX_SCATTER_CELLS = 300 * 200;
    const scatterX = new Float32Array(MAX_SCATTER_CELLS);
    const scatterY = new Float32Array(MAX_SCATTER_CELLS);
    for (let i = 0; i < MAX_SCATTER_CELLS; i++) {
      scatterX[i] = (Math.random() - 0.5) * 2; // -1 to 1
      scatterY[i] = (Math.random() - 0.5) * 2;
    }

    // ─── Render ───
    function animate() {
      requestAnimationFrame(animate);

      pivotGroup.rotation.y += autoRotateSpeed;
      pivotGroup.rotation.x += rotVel.x;
      pivotGroup.rotation.y += rotVel.y;
      rotVel.x *= 0.92;
      rotVel.y *= 0.92;

      if (!modelLoaded) return;

      // Start assemble timer on first render
      if (assembleStartTime === null) assembleStartTime = performance.now();
      const elapsed = performance.now() - assembleStartTime;
      // scatter factor: 1 (fully scattered) → 0 (assembled), ease out cubic
      const scatterT = Math.max(0, 1 - elapsed / ASSEMBLE_DURATION);
      const scatter = scatterT * scatterT * scatterT; // ease in (fast settle)
      const scatterRange = 250; // max pixel scatter distance

      renderer.render(scene, camera);

      const gl = renderer.getContext();
      gl.readPixels(0, 0, RENDER_SIZE, RENDER_SIZE, gl.RGBA, gl.UNSIGNED_BYTE, pixelBuf);

      const cw = asciiCanvas.width;
      const ch = asciiCanvas.height;
      asciiCtx.fillStyle = 'rgba(28, 43, 79, 1)';
      asciiCtx.fillRect(0, 0, cw, ch);

      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      const fontSize = 9 * dpr;
      const cellW = fontSize * 0.58;
      const cellH = fontSize * 1.1;
      const cols = Math.floor(cw / cellW);
      const rows = Math.floor(ch / cellH);

      const renderPixelSize = ch;
      const renderPixelLeft = (cw - renderPixelSize) / 2;

      asciiCtx.font = `${fontSize}px 'JetBrains Mono', monospace`;
      asciiCtx.textBaseline = 'middle';

      for (let row = 0; row < rows; row++) {
        for (let col = 0; col < cols; col++) {
          const px = col * cellW;
          const py = row * cellH;

          const sx = Math.floor(((px - renderPixelLeft) / renderPixelSize) * RENDER_SIZE);
          const sy = RENDER_SIZE - 1 - Math.floor((py / ch) * RENDER_SIZE);
          if (sx < 0 || sx >= RENDER_SIZE || sy < 0 || sy >= RENDER_SIZE) continue;

          const idx = (sy * RENDER_SIZE + sx) * 4;
          const r = pixelBuf[idx];
          const g = pixelBuf[idx + 1];
          const b = pixelBuf[idx + 2];
          const a = pixelBuf[idx + 3];

          if (a < 5) continue;

          const brightness = (r * 0.299 + g * 0.587 + b * 0.114) / 255;
          if (brightness < 0.015) continue;

          const charIdx = Math.min(Math.floor(brightness * ALL_CHARS.length), ALL_CHARS.length - 1);
          const char = ALL_CHARS[charIdx];
          if (char === ' ') continue;

          let cr, cg, cb, ca;
          if (brightness < 0.33) {
            cr = 30; cg = 80 + brightness * 200; cb = 50 + brightness * 100;
            ca = 0.25 + brightness * 0.5;
          } else if (brightness < 0.66) {
            cr = 40 + brightness * 40; cg = 150 + brightness * 100; cb = 80 + brightness * 60;
            ca = 0.5 + brightness * 0.4;
          } else {
            cr = 80 + brightness * 80; cg = 200 + brightness * 55; cb = 140 + brightness * 50;
            ca = 0.7 + brightness * 0.3;
          }

          asciiCtx.fillStyle = `rgba(${Math.floor(cr)}, ${Math.floor(cg)}, ${Math.floor(cb)}, ${ca})`;
          // Apply scatter offset during assemble animation
          const cellIdx = (row * cols + col) % MAX_SCATTER_CELLS;
          const ox = scatter * scatterRange * scatterX[cellIdx];
          const oy = scatter * scatterRange * scatterY[cellIdx];
          asciiCtx.fillText(char, col * cellW + ox, row * cellH + cellH * 0.5 + oy);
        }
      }

      // Ambient particles
      const time = performance.now() * 0.001;
      asciiCtx.font = `${fontSize * 0.7}px 'JetBrains Mono', monospace`;
      const particleChars = ['.', ':', '+', '-', '*', '.', '.'];
      for (let i = 0; i < 60; i++) {
        const px = (Math.sin(time * 0.15 + i * 2.1) * 0.5 + 0.5) * cw;
        const py = (Math.cos(time * 0.12 + i * 1.7) * 0.5 + 0.5) * ch;
        const pa = (Math.sin(time * 0.5 + i * 0.8) * 0.5 + 0.5) * 0.08;
        asciiCtx.fillStyle = `rgba(116, 232, 177, ${pa})`;
        asciiCtx.fillText(particleChars[i % particleChars.length], px, py);
      }
    }

    animate();

    // ─── Typing Effect ───
    const typedEl = document.getElementById('typed-text');
    const words = ['password reset', 'interview', 'account recovery', 'onboarding', 'access request'];
    let wordIndex = 0;
    let charIndex = words[0].length;
    let isDeleting = true;

    setTimeout(typeLoop, 2500);

    function typeLoop() {
      const currentWord = words[wordIndex];

      if (isDeleting) {
        charIndex--;
        typedEl.textContent = currentWord.substring(0, charIndex);

        if (charIndex === 0) {
          isDeleting = false;
          wordIndex = (wordIndex + 1) % words.length;
          setTimeout(typeLoop, 400);
          return;
        }
        setTimeout(typeLoop, 50 + Math.random() * 30);
      } else {
        const nextWord = words[wordIndex];
        charIndex++;
        typedEl.textContent = nextWord.substring(0, charIndex);

        if (charIndex === nextWord.length) {
          isDeleting = true;
          setTimeout(typeLoop, 2200);
          return;
        }
        setTimeout(typeLoop, 80 + Math.random() * 40);
      }
    }
  </script>

</body>
