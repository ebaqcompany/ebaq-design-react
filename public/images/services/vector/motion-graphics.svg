<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080" fill="none" role="img" aria-labelledby="title">
  <title id="title">A ball bouncing along a dashed motion path</title>
  <rect x="260" y="220" width="560" height="560" fill="#fff" stroke="#000" stroke-width="6"/>
  <path id="ground" d="M320 680H760" stroke="#000" stroke-width="6"/>
  <path id="motion-path" d="M360 644Q450 200 540 644Q610 400 680 644" stroke="#000" stroke-width="4" stroke-dasharray="12 10"/>
  <g id="ghost-frames" fill="#fff" stroke="#000" stroke-width="4">
    <circle cx="360" cy="644" r="36"/>
    <circle cx="450" cy="422" r="36"/>
    <ellipse cx="540" cy="654" rx="46" ry="26"/>
  </g>
  <circle id="ball" cx="610" cy="522" r="36" fill="#00AFEC" stroke="#000" stroke-width="6"/>
  <g id="dots-blue" fill="#00AFEC">
    <circle cx="160" cy="440" r="14"/>
    <circle cx="880" cy="160" r="14"/>
  </g>
  <g id="dots-black" fill="#000">
    <circle cx="360" cy="120" r="8"/>
    <circle cx="920" cy="760" r="8"/>
  </g>
</svg>
