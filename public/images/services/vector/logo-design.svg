<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080" fill="none" role="img" aria-labelledby="title">
  <title id="title">A logo mark drawn over circular construction guides</title>
  <rect x="260" y="220" width="560" height="560" fill="#fff" stroke="#000" stroke-width="6"/>
  <g id="mark" transform="translate(380 340)" fill="#00AFEC" stroke="#000" stroke-width="6">
    <path d="M0 160A160 160 0 0 1 160 0V160Z"/>
    <circle cx="240" cy="80" r="80"/>
    <path d="M320 160A160 160 0 0 1 160 320V160Z"/>
    <circle cx="80" cy="240" r="80"/>
  </g>
  <g id="guides" stroke="#000" stroke-width="3" stroke-dasharray="10 8">
    <path d="M300 500H780M540 260V740"/>
    <circle cx="540" cy="500" r="160"/>
  </g>
  <g id="anchor-points" fill="#fff" stroke="#000" stroke-width="4">
    <rect x="372" y="492" width="16" height="16"/>
    <rect x="532" y="332" width="16" height="16"/>
    <rect x="692" y="492" width="16" height="16"/>
    <rect x="532" y="652" width="16" height="16"/>
  </g>
  <g id="dots-blue" fill="#00AFEC">
    <circle cx="920" cy="280" r="14"/>
    <circle cx="160" cy="680" r="14"/>
  </g>
  <g id="dots-black" fill="#000">
    <circle cx="160" cy="200" r="8"/>
    <circle cx="920" cy="840" r="8"/>
  </g>
</svg>
