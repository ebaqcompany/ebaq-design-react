<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080" fill="none" role="img" aria-labelledby="title">
  <title id="title">Three stacked brand cards in black, blue, and white, the front one carrying the logo</title>
  <g id="cards" stroke="#000" stroke-width="6">
    <rect x="240" y="200" width="400" height="400" fill="#000"/>
    <rect x="340" y="300" width="400" height="400" fill="#00AFEC"/>
    <rect x="440" y="400" width="400" height="400" fill="#fff"/>
  </g>
  <g id="mark" transform="translate(540 500) scale(.625)" fill="#00AFEC" stroke="#000" stroke-width="9.6">
    <path d="M0 160A160 160 0 0 1 160 0V160Z"/>
    <circle cx="240" cy="80" r="80"/>
    <path d="M320 160A160 160 0 0 1 160 320V160Z"/>
    <circle cx="80" cy="240" r="80"/>
  </g>
  <g id="dots-blue" fill="#00AFEC">
    <circle cx="840" cy="240" r="14"/>
    <circle cx="200" cy="760" r="14"/>
  </g>
  <g id="dots-black" fill="#000">
