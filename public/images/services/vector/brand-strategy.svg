<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080" fill="none" role="img" aria-labelledby="title">
  <title id="title">A positioning map with one brand standing apart from a cluster of competitors</title>
  <g id="positioning-map" stroke="#000" stroke-width="6">
    <rect x="260" y="220" width="560" height="560" fill="#fff"/>
    <path d="M540 280V720M320 500H760"/>
    <g id="competitors" fill="#fff">
      <circle cx="380" cy="590" r="24"/>
      <circle cx="460" cy="630" r="24"/>
      <circle cx="400" cy="680" r="24"/>
    </g>
    <path id="route" d="M484 630C600 630 660 550 660 436" stroke-width="4" stroke-dasharray="12 10"/>
    <circle id="brand" cx="660" cy="380" r="56" fill="#00AFEC"/>
  </g>
  <g id="dots-blue" fill="#00AFEC">
    <circle cx="160" cy="320" r="14"/>
    <circle cx="920" cy="720" r="14"/>
  </g>
  <g id="dots-black" fill="#000">
    <circle cx="920" cy="200" r="8"/>
    <circle cx="160" cy="840" r="8"/>
  </g>
</svg>
