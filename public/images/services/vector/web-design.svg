<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080" fill="none" role="img" aria-labelledby="title">
  <title id="title">A browser window with a headline, an image, and a cursor on the main button</title>
  <g id="browser" stroke="#000" stroke-width="6">
    <rect x="200" y="260" width="680" height="480" fill="#fff"/>
    <rect x="200" y="260" width="680" height="60" fill="#00AFEC"/>
    <g fill="#fff" stroke-width="4">
      <circle cx="240" cy="290" r="9"/>
      <circle cx="272" cy="290" r="9"/>
      <circle cx="304" cy="290" r="9"/>
    </g>
    <path id="headline" d="M260 420H520M260 476H440" stroke-width="24"/>
    <rect id="button" x="260" y="560" width="200" height="72" fill="#00AFEC"/>
    <rect id="image" x="600" y="400" width="220" height="280" fill="#00AFEC"/>
