<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080" fill="none" data-illustration="web-design">
<title>Web Design — draw copy, lift linework, click and rotate the yellow image</title>
<style>
[data-illustration="web-design"] .cursor-move {animation: wd-cursor 4.2s linear infinite}
[data-illustration="web-design"] .cursor-press-geometry {animation: wd-press 4.2s linear infinite}
[data-illustration="web-design"] .copy-line {animation: wd-copy 4.2s linear infinite}
[data-illustration="web-design"] .finished-linework {animation: wd-pop 4.2s linear infinite}
[data-illustration="web-design"] .image-rotation {transform-origin:740px 515px;animation: wd-image 4.2s linear infinite}
[data-illustration="web-design"] .image-fill {animation: wd-yellow 4.2s linear infinite}
/* .18-.53s draw. Strategy Avatar reference: 12 frames out, 28 back at 60fps; no hold.
   4*(1080*3/2)/430 = 15.069767 SVG units matches rendered Strategy displacement. */
@keyframes wd-cursor {
 0%,4.285714% {transform:translate(115px,560px)}
 12.619048% {transform:translate(190px,560px);animation-timing-function:cubic-bezier(.65,0,.35,1)}
 26.190476%,32.857143% {transform:translate(640px,700px);animation-timing-function:cubic-bezier(.65,0,.35,1)}
 45.238095%,76.190476% {transform:translate(740px,515px);animation-timing-function:cubic-bezier(.65,0,.35,1)}
 92.857143%,100% {transform:translate(115px,560px)}
}
@keyframes wd-copy {
 0%,4.285714% {stroke-dashoffset:75}
 12.619048%,95.238095% {stroke-dashoffset:0;animation-timing-function:steps(1,end)}
 95.24%,100% {stroke-dashoffset:75}
}
@keyframes wd-press {
 0%,26.190476%,31.190476%,45.238095%,50.238095%,100% {d:path("M0 0 25.000000000 91.000000000 45.000000000 59.000000000 81.000000000 52.000000000Z")}
 28.174603%,47.222222% {d:path("M0 0 21.500000000 78.260000000 38.700000000 50.740000000 69.660000000 44.720000000Z")}
}
@keyframes wd-pop {
 0%,26.666667% {transform:translate(0,0);animation-timing-function:cubic-bezier(.22,1,.36,1)}
 31.428571% {transform:translate(-15.069767px,-15.069767px);animation-timing-function:cubic-bezier(.65,0,.35,1)}
 42.539683%,100% {transform:translate(0,0)}
}
/* Strategy triangle angle/easing: -6 degrees in .2s, return over .433s. */
@keyframes wd-image {
 0%,45.238095% {transform:rotate(0);animation-timing-function:cubic-bezier(.22,1,.36,1)}
 50% {transform:rotate(-6deg);animation-timing-function:cubic-bezier(.65,0,.35,1)}
 60.317460%,100% {transform:rotate(0)}
}
@keyframes wd-yellow {
 0%,45.238095% {fill:#fff}
 50%,76.190476% {fill:#FED440}
 83.333333%,100% {fill:#fff}
}
@media(prefers-reduced-motion:reduce) {
 [data-illustration="web-design"] .cursor-move,[data-illustration="web-design"] .cursor-press-geometry,[data-illustration="web-design"] .copy-line,[data-illustration="web-design"] .finished-linework,[data-illustration="web-design"] .image-rotation,[data-illustration="web-design"] .image-fill {animation:none}
 [data-illustration="web-design"] .cursor-move {transform:translate(640px,700px)}
 [data-illustration="web-design"] .copy-line {stroke-dashoffset:0}
}


</style><g stroke="#000" stroke-width="5.651162790698" stroke-linecap="round" stroke-linejoin="round">
  <g id="wireframe-and-static-palette" transform="translate(-60 0)"><g id="wireframe">
    <rect x="140" y="230" width="290" height="380" rx="8" fill="#fff" />
    <path d="M140 285h290M175 325h155M175 350h110" />
    <rect x="175" y="395" width="220" height="125" fill="#fff" />
    <path d="m175 395 220 125m0-125L175 520" />
  <path id="drawn-copy-line" class="copy-line" d="M175 560h75" pathLength="75" stroke-dasharray="75" stroke-dashoffset="75" /></g>
  <g id="wireframe-palette" transform="translate(-20 315) scale(.5)" stroke-width="11.302325581395"><rect x="350" y="670" width="510" height="140" rx="8" fill="#fff" class="swatch-one" /><path d="M520 670h170v140H520Z" fill="#00AFEC" class="swatch-two" /><path d="M690 670h162a8 8 0 0 1 8 8v124a8 8 0 0 1-8 8H690Z" fill="#000" class="swatch-three" /></g></g><g id="website">
    <rect x="540" y="330" width="400" height="430" rx="8" fill="#00AFEC" stroke="none" id="website-stationary-blue-fill" />
    <g id="finished-design-linework" class="finished-linework"><rect x="540" y="330" width="400" height="430" rx="8" fill="none" id="website-outer-border" />
    <path d="M540 390h400M580 360h62M819 360h80" />
    <g id="interactive-image" class="image-rotation"><rect x="580" y="430" width="320" height="170" fill="#fff" id="interactive-image-fill" class="image-fill" />
    <path d="m580 600 93-110 75 81 53-54 99 83" /></g><path d="M580 641h183" /><rect x="580" y="680" width="120" height="40" rx="4" fill="#fff" />
  </g></g>
  <g id="design-handoff">
    <g id="strategy-filled-arrow" stroke-width="5.651163" stroke-linecap="butt" stroke-linejoin="miter"><path d="M370 480H493.852605"/><path d="M479.867860 463.686977 508.123674 480 479.867860 496.313023Z" fill="#000" stroke="none"/></g>
  </g>
  <g class="cursor-move" id="interaction-cursor"><g class="cursor-press"><path class="cursor-press-geometry" d="M0 0 25 91 45 59 81 52Z" fill="#fff" /></g></g></g>
</svg>
