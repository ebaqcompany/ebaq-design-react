 </g></g><g transform="translate(-153.32467957 0)"><g class="pencil-visibility"><g class="pencil-position"><g id="drawing-pencil"><path d="M0 0 12-42 103-133 133-103 42-12Z" fill="#00AFEC"/><path d="m12-42 30 30M88-118l30 30"/><path d="M0 0 5-17 17-5Z" fill="#000"/></g></g></g>
