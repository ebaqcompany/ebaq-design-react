<svg xmlns="http://www.w3.org/2000/svg" width="1620" height="1080" viewBox="0 0 1620 1080" fill="none" data-illustration="logo-digitize">
<title>Logo Design — sketch to digital logo with horizontal toolbar</title>
<desc>A pencil draws a triangle on paper, then transfers it to a blue digital panel beside the ABC wordmark. A compact horizontal toolbar below the panel contains the circle, text, and grid tools from the earlier selection study.</desc>
<defs><mask id="sketch-triangle-reveal" maskUnits="userSpaceOnUse" x="205" y="372" width="200" height="176"><path class="triangle-reveal" d="M215 537.942286 L305 382.057714 L395 537.942286 L215 537.942286" pathLength="1" stroke="white" stroke-width="12" stroke-dasharray="1" /></mask></defs>
<style>
[data-illustration="logo-digitize"] .triangle-reveal{animation:ld-reveal 6s linear infinite}
[data-illustration="logo-digitize"] .sketch-dotted{animation:ld-dotted 6s steps(1,end) infinite}
[data-illustration="logo-digitize"] .sketch-solid{animation:ld-solid 6s steps(1,end) infinite}
[data-illustration="logo-digitize"] .pencil-position{animation:ld-pencil 6s linear infinite}
[data-illustration="logo-digitize"] .pencil-visibility{animation:ld-pencil-show 6s steps(1,end) infinite}
[data-illustration="logo-digitize"] .transfer-dot{animation:ld-transfer 6s linear infinite}
[data-illustration="logo-digitize"] .digital-result{animation:ld-result 6s steps(1,end) infinite}
[data-illustration="logo-digitize"] .digital-bump{animation:ld-bump 6s linear infinite}
[data-illustration="logo-digitize"] .letter-a{animation:ld-a 6s steps(1,end) infinite}
[data-illustration="logo-digitize"] .letter-b{animation:ld-b 6s steps(1,end) infinite}
[data-illustration="logo-digitize"] .letter-c{animation:ld-c 6s steps(1,end) infinite}
@keyframes ld-reveal{0%,4.166667%,95.833333%,100%{stroke-dashoffset:1}27.500000%,95.816667%{stroke-dashoffset:0}}
@keyframes ld-dotted{0%,95.833333%,100%{opacity:1}27.500000%{opacity:0}}
@keyframes ld-solid{0%,95.833333%,100%{opacity:0}27.500000%{opacity:1}}
@keyframes ld-pencil{0%,4.166667%{transform:translate(215px,537.942286px)}11.944444%{transform:translate(305px,382.057714px)}19.722222%{transform:translate(395px,537.942286px)}27.500000%,100%{transform:translate(215px,537.942286px)}}
@keyframes ld-pencil-show{0%,95.833333%,100%{opacity:1}29.166667%{opacity:0}}
@keyframes ld-transfer{0%,24.983333%{opacity:0;transform:translate(301.67532043px,460px)}25.000000%{opacity:1;transform:translate(301.67532043px,460px)}27.523737%{opacity:1;transform:translate(413.337660215px,460px)}31.049573%{opacity:1;transform:translate(413.337660215px,304px)}35.000000%{opacity:1;transform:translate(588.1236744186047px,304px)}35.016667%,100%{opacity:0;transform:translate(588.1236744186047px,304px)}}
@keyframes ld-result{0%,95.833333%,100%{opacity:0}35.000000%{opacity:1}}
@keyframes ld-bump{0%,35.000000%{transform:translate(0,0);animation-timing-function:cubic-bezier(.22,1,.36,1)}38.333333%{transform:translate(-15.069767px,-15.069767px);animation-timing-function:cubic-bezier(.65,0,.35,1)}46.111111%,100%{transform:translate(0,0)}}
@keyframes ld-a{0%,95.833333%,100%{opacity:0}45.000000%{opacity:1}}
@keyframes ld-b{0%,95.833333%,100%{opacity:0}48.333333%{opacity:1}}
@keyframes ld-c{0%,95.833333%,100%{opacity:0}51.666667%{opacity:1}}
@media(prefers-reduced-motion:reduce){[data-illustration="logo-digitize"] *{animation:none}[data-illustration="logo-digitize"] .sketch-dotted,[data-illustration="logo-digitize"] .pencil-visibility,[data-illustration="logo-digitize"] .transfer-dot{opacity:0}}
</style>
<g transform="translate(270 135)" stroke="#000" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
