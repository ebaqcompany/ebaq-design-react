<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080" fill="none" data-illustration="logo-digitize">
<title>Logo Design — from pencil sketch to digital ABC logo</title>
<desc>A pencil draws a clockwise circle from the bottom and two text lines on landscape paper. A yellow dot transfers the sketch along an arrow to a blue digital panel, where a finished circle and ABC appear.</desc>
