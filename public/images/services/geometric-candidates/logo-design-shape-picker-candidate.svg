<title>Logo Design — triangle to star selected from the toolbar</title>
<desc>The original sketch becomes a digital ABC logo. A cursor opens a bottom-anchored picker that opens upward, with square above triangle and star at the top, overlapping the artboard, skips the square, and selects the yellow star; the toolbar icon and artboard symbol change from triangle to star together.</desc>
