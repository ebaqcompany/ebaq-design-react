<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080" fill="none" data-illustration="web-development">
<title>Web Development — geometric service illustration</title>
<style>
/* Five-second cycle. Reference Agents: 60fps, clicks at frames 62 and 140,
   86% cursor press; outline offsets over 12 frames, return over 26 frames.
   Geometry/fills remain independent and stationary. */
[data-illustration="web-development"] .cursor-move { animation: web-development-cursor-move 5s cubic-bezier(.65,0,.35,1) infinite; }
[data-illustration="web-development"] .cursor-press-geometry { animation: web-development-cursor-press 5s linear infinite; }
[data-illustration="web-development"] .outline-1 { animation: web-development-outline-1 5s linear infinite; }
[data-illustration="web-development"] .outline-2 { animation: web-development-outline-2 5s linear infinite; }
@keyframes web-development-cursor-move {
  0%,2% { transform:translate(890px,795px); }
  20.6667%,32% { transform:translate(430px,460px); }
  46.6667%,69.3333% { transform:translate(800px,560px); }
  100% { transform:translate(890px,795px); }
}
@keyframes web-development-cursor-press {
  0%,20.6667%,26.6667%,46.6667%,52.6667%,100% { d:path("M0 0 25.000000000 91.000000000 45.000000000 59.000000000 81.000000000 52.000000000Z"); }
  22.3333%,48.3333% { d:path("M0 0 21.500000000 78.260000000 38.700000000 50.740000000 69.660000000 44.720000000Z"); }
}
@keyframes web-development-outline-1 {
  0%,21.3333% {transform:translate(0,0);animation-timing-function:cubic-bezier(.22,1,.36,1)}
  25.3333%,34.6667% {transform:translate(-10px,-10px);animation-timing-function:cubic-bezier(.65,0,.35,1)}
  43.3333%,100% {transform:translate(0,0)}
}
@keyframes web-development-outline-2 {
  0%,47.3333% {transform:translate(0,0);animation-timing-function:cubic-bezier(.22,1,.36,1)}
  51.3333%,60.6667% {transform:translate(-10px,-10px);animation-timing-function:cubic-bezier(.65,0,.35,1)}
  69.3333%,100% {transform:translate(0,0)}
}
@media(prefers-reduced-motion:reduce) {
 [data-illustration="web-development"] .cursor-move {transform:translate(800px,560px)}
}
