@keyframes ld-pencil{0%,4.166667%{transform:translate(215px,537.942286px)}11.944444%{transform:translate(305px,382.057714px)}19.722222%{transform:translate(395px,537.942286px)}27.500000%,100%{transform:translate(215px,537.942286px)}}
@keyframes ld-pencil-show{0%,95.833333%,100%{opacity:1}29.166667%{opacity:0}}
