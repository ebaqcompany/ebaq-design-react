@keyframes ld-palette-click{0%,55.000000%,57.666667%,66.666667%,69.333333%,78.333333%,81.000000%,100%{transform:translateY(0)}56.333333%,68.000000%,79.666667%{transform:translateY(3px)}}
@media(prefers-reduced-motion:reduce){[data-illustration="logo-digitize"] .palette-surface,[data-illustration="logo-digitize"] .palette-symbol,[data-illustration="logo-digitize"] .palette-ink,[data-illustration="logo-digitize"] .palette-cursor,[data-illustration="logo-digitize"] .palette-click{animation:none}[data-illustration="logo-digitize"] .palette-cursor{opacity:0}}

/* Strategy Circle reaction: whole digital assembly scales100→112%,
   10 frames out /22 back at60fps; palette and sketch remain fixed. */
[data-illustration="logo-digitize"] .whole-digital-pulse{transform-origin:815px 430px;animation:ld-whole-panel-pulse 6s linear infinite}
