<svg xmlns="http://www.w3.org/2000/svg" width="1620" height="1080" viewBox="0 0 1620 1080" fill="none" data-illustration="logo-digitize">
<title>Logo Design — from pencil sketch to digital ABC logo</title>
<desc>A pencil draws one large centered triangle on landscape paper. A yellow dot transfers the sketch along an arrow to a blue digital panel, where the same triangle sits to the left of ABC. The sketch contains only the triangle; the digital version adds the ABC wordmark. After ABC types, a cursor clicks three palette swatches, changing the digital logo to white, black, and yellow surfaces.</desc>
<defs><mask id="sketch-triangle-reveal" maskUnits="userSpaceOnUse" x="205" y="372" width="200" height="176"><path class="triangle-reveal" d="M215 537.942286 L305 382.057714 L395 537.942286 L215 537.942286" pathLength="1" stroke="white" stroke-width="12" stroke-dasharray="1" /></mask></defs>
<style>
[data-illustration="logo-digitize"] .triangle-reveal{animation:ld-reveal 6s linear infinite}
[data-illustration="logo-digitize"] .sketch-dotted{animation:ld-dotted 6s steps(1,end) infinite}
[data-illustration="logo-digitize"] .sketch-solid{animation:ld-solid 6s steps(1,end) infinite}
[data-illustration="logo-digitize"] .pencil-position{animation:ld-pencil 6s linear infinite}
[data-illustration="logo-digitize"] .pencil-visibility{animation:ld-pencil-show 6s steps(1,end) infinite}
[data-illustration="logo-digitize"] .transfer-dot{animation:ld-transfer 6s linear infinite}
[data-illustration="logo-digitize"] .digital-result{animation:ld-result 6s steps(1,end) infinite}
