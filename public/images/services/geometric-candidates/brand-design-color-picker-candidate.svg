<svg xmlns="http://www.w3.org/2000/svg" width="1620" height="1080" viewBox="0 0 1620 1080" fill="none">
<title>Brand Design — style guide, overlapping star logo and color picker</title>
<desc>A tall style-guide sheet with three thumbnail boxes and text lines. A landscape star-over-ABC logo card overlaps its right edge; a blue, black, and yellow swatch strip overlaps its bottom-left edge. Cursor selections change the star logo colors in sync; the logo stays a star.</desc>
<style>
.brand-surface{animation:brand-surface 4s steps(1,end) infinite}
.brand-symbol{animation:brand-symbol 4s steps(1,end) infinite}
.brand-ink{animation:brand-ink 4s steps(1,end) infinite}
.brand-cursor{animation:brand-cursor 4s cubic-bezier(.65,0,.35,1) infinite}
.brand-click{animation:brand-click 4s linear infinite}
@keyframes brand-surface{0%,100%{fill:#00AFEC}30%{fill:#000}60%{fill:#FED440}90%{fill:#00AFEC}}
@keyframes brand-symbol{0%,100%{fill:#fff;stroke:#000}30%{fill:#fff;stroke:#000}60%{fill:#000;stroke:#000}90%{fill:#fff;stroke:#000}}
@keyframes brand-ink{0%,100%{stroke:#000}30%{stroke:#fff}60%,90%{stroke:#000}}
@keyframes brand-cursor{0%,12%,100%{opacity:1;transform:translate(122px,770px)}28%,42%{opacity:1;transform:translate(222px,770px)}58%,72%{opacity:1;transform:translate(322px,770px)}88%{opacity:1;transform:translate(122px,770px)}}
@keyframes brand-click{0%,28%,32%,58%,62%,88%,92%,100%{transform:translateY(0)}30%,60%,90%{transform:translateY(3px)}}
@media(prefers-reduced-motion:reduce){.brand-surface,.brand-symbol,.brand-ink,.brand-cursor,.brand-click{animation:none}.brand-cursor{opacity:0}}

/* Actual Brand Strategy Circle ripple: starts 2 frames after the click,
   expands 100→123.333% (one third of the reference expansion delta) and fades 100→0 over 40 frames at 60fps, (.22,1,.36,1).
   Animate rectangle geometry instead of transform: the 6-unit stroke stays
   identical to the base outline at every responsive rendering scale. */
.artboard-outline-pulse{animation:artboard-outline-pulse 4s linear infinite;stroke-width:5.651162790698}
.pulse-1{animation-delay:1.233333333s}.pulse-2{animation-delay:2.433333333s}.pulse-3{animation-delay:3.633333333s}
@keyframes artboard-outline-pulse{
 0%{opacity:1;x:500px;y:310px;width:440px;height:300px;rx:8px;animation-timing-function:cubic-bezier(.22,1,.36,1)}
 16.666666667%{opacity:0;x:448.666666667px;y:275px;width:542.666666667px;height:370px;rx:9.866666667px}
 100%{opacity:0;x:448.666666667px;y:275px;width:542.666666667px;height:370px;rx:9.866666667px}
}
@media(prefers-reduced-motion:reduce){.artboard-outline-pulse{animation:none;opacity:0}}
</style><g stroke="#000" stroke-width="5.651162790698" stroke-linecap="round" stroke-linejoin="round" transform="translate(295 0)">
