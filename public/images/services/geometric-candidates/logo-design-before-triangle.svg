<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080" fill="none" data-illustration="logo-digitize">
<title>Logo Design — from pencil sketch to digital ABC logo</title>
<desc>A pencil draws a clockwise circle from the bottom and two text lines on landscape paper. A yellow dot transfers the sketch along an arrow to a blue digital panel, where a finished circle sits to the left of ABC. Both stages use a horizontal logo lockup. After ABC types, a cursor clicks three palette swatches, changing the digital logo to white, black, and yellow surfaces.</desc>
